plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.pharmaconnect.app"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.pharmaconnect.app"
        minSdk = 23  // Firebase Auth requires minSdk 23+
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    // TODO: Production Signing Configuration
    // For release builds, replace signingConfigs.debug with your production signing config
    // Example:
    //
    // signingConfigs {
    //   release {
    //     storeFile file("path/to/keystore.jks")
    //     storePassword System.getenv("KEYSTORE_PASSWORD")
    //     keyAlias System.getenv("KEY_ALIAS")
    //     keyPassword System.getenv("KEY_PASSWORD")
    //   }
    // }

    buildTypes {
        release {
            // SECURITY WARNING: Using debug signing config in release is insecure
            // TODO: Switch to production signing config for app store releases
            signingConfig = signingConfigs.debug

            // Enable code shrinking and ProGuard
            minifyEnabled true
            shrinkResources true

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}
