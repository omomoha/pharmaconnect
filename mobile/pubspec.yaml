name: pharmaconnect
description: PharmaConnect - Online Pharmacy Marketplace Mobile App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_crashlytics: ^4.1.3

  # Networking & HTTP
  http: ^1.3.0

  # Routing
  go_router: ^14.8.1

  # State Management
  provider: ^6.1.2

  # WebSocket & Real-time
  socket_io_client: ^3.0.2

  # Fonts
  google_fonts: ^6.2.1

  # SVG Support
  flutter_svg: ^2.0.17

  # Internationalization
  intl: ^0.20.2

  # Local Storage
  shared_preferences: ^2.3.4

  # Caching
  cached_network_image: ^3.4.1

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # Media Picking
  image_picker: ^1.1.2

  # URL Launcher
  url_launcher: ^6.3.1

  # Loading Skeletons
  shimmer: ^3.0.0

  # Charts
  fl_chart: ^0.70.2

  # Badges
  badges: ^3.1.2

  # PIN Code Input
  pin_code_fields: ^8.0.1

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Push Notifications
  firebase_messaging: ^15.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Fonts loaded via google_fonts package at runtime
  # No local font assets needed
