<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- White pharmacy cross -->
  <rect x="200" y="96" width="112" height="320" rx="24" ry="24" fill="white"/>
  <rect x="96" y="200" width="320" height="112" rx="24" ry="24" fill="white"/>
  <!-- Small pill accent -->
  <ellipse cx="390" cy="122" rx="40" ry="18" fill="white" opacity="0.3" transform="rotate(-30 390 122)"/>
</svg>
